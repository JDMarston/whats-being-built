<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>What's Being Built - St. Petersburg</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.css">
  <style>
    /* Shared theme values for the full-screen map UI. */
    :root {
      color-scheme: dark;
      --panel: rgba(13, 20, 24, 0.86);
      --panel-strong: rgba(13, 20, 24, 0.96);
      --text: #f5f7f8;
      --muted: #b7c2c8;
      --accent: #ffb000;
      --accent-strong: #ff7a1a;
      --line: rgba(255, 255, 255, 0.16);
      --shadow: 0 14px 34px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #0d1418;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
    }

    /* Keep the header fixed above a map that fills the remaining viewport. */
    .app-shell {
      display: grid;
      grid-template-rows: auto 1fr;
      width: 100%;
      height: 100vh;
      height: 100dvh;
    }

    header {
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: max(12px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-right)) 12px max(14px, env(safe-area-inset-left));
      color: var(--text);
      background: linear-gradient(90deg, rgba(8, 15, 18, 0.96), rgba(17, 29, 34, 0.92));
      border-bottom: 1px solid var(--line);
      box-shadow: var(--shadow);
    }

    .brand {
      min-width: 0;
    }

    h1 {
      margin: 0;
      font-size: 1.05rem;
      line-height: 1.15;
      font-weight: 700;
      letter-spacing: 0;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 5px;
      color: var(--muted);
      font-size: 0.78rem;
      line-height: 1.2;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    select,
    button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.1);
      font: inherit;
      cursor: pointer;
    }

    select {
      max-width: 190px;
      padding: 0 34px 0 11px;
    }

    button {
      min-width: 44px;
      padding: 0 12px;
      font-weight: 700;
    }

    button.active {
      color: #1c1400;
      border-color: transparent;
      background: var(--accent);
    }

    #map {
      width: 100%;
      height: 100%;
      min-height: 0;
    }

    /* Small status panel describing which imagery source is currently visible. */
    .imagery-badge {
      position: absolute;
      left: max(12px, env(safe-area-inset-left));
      bottom: max(26px, env(safe-area-inset-bottom));
      z-index: 1;
      max-width: min(360px, calc(100vw - 24px));
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--text);
      background: var(--panel);
      box-shadow: var(--shadow);
      pointer-events: none;
    }

    .imagery-badge strong {
      display: block;
      font-size: 0.85rem;
      line-height: 1.2;
    }

    .imagery-badge span {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 0.72rem;
      line-height: 1.25;
    }

    /* Custom project pins are buttons so they stay keyboard-accessible. */
    .project-marker {
      display: grid;
      place-items: center;
      width: 28px;
      height: 28px;
      padding: 0;
      border: 2px solid #ffffff;
      border-radius: 50%;
      background: var(--accent-strong);
      box-shadow: 0 3px 14px rgba(0, 0, 0, 0.44);
      transform: translateY(-2px);
    }

    .project-marker::after {
      width: 8px;
      height: 8px;
      border-radius: 2px;
      background: #1f1300;
      content: "";
    }

    .project-marker.status-proposed {
      background: #4fb4ff;
    }

    .project-marker.status-recently-completed {
      background: #42c47c;
    }

    .project-marker:hover,
    .project-marker:focus-visible {
      outline: 3px solid rgba(255, 176, 0, 0.35);
      outline-offset: 3px;
    }

    .maplibregl-popup {
      max-width: min(330px, calc(100vw - 28px)) !important;
    }

    .maplibregl-popup-content {
      padding: 14px 15px 12px;
      border-radius: 8px;
      color: #172126;
      font-size: 0.91rem;
      line-height: 1.42;
      box-shadow: var(--shadow);
    }

    .maplibregl-popup-content h2 {
      margin: 0 26px 4px 0;
      font-size: 1.02rem;
      line-height: 1.18;
    }

    .maplibregl-popup-content p {
      margin: 9px 0;
    }

    .popup-status {
      display: inline-block;
      margin-bottom: 8px;
      color: #516169;
      font-style: italic;
    }

    .popup-details {
      display: grid;
      gap: 4px;
      margin: 8px 0;
      color: #26343a;
      font-size: 0.84rem;
    }

    .maplibregl-popup-content ul {
      padding-left: 18px;
      margin: 6px 0 0;
    }

    .maplibregl-popup-content li {
      margin: 4px 0;
    }

    .maplibregl-popup-content a {
      color: #005ea8;
    }

    .maplibregl-ctrl-top-right {
      top: 76px;
    }

    .maplibregl-ctrl-group {
      overflow: hidden;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .maplibregl-ctrl button {
      min-width: 0;
      min-height: 0;
    }

    .locate-icon {
      position: relative;
      display: block;
      width: 18px;
      height: 18px;
      margin: auto;
      border: 2px solid #1f2c33;
      border-radius: 50%;
    }

    .locate-icon::before,
    .locate-icon::after {
      position: absolute;
      background: #1f2c33;
      content: "";
    }

    .locate-icon::before {
      top: 50%;
      left: -5px;
      width: 24px;
      height: 2px;
      transform: translateY(-50%);
    }

    .locate-icon::after {
      top: -5px;
      left: 50%;
      width: 2px;
      height: 24px;
      transform: translateX(-50%);
    }

    .user-puck {
      --heading: 0deg;
      position: relative;
      width: 23px;
      height: 23px;
      border: 3px solid #ffffff;
      border-radius: 50%;
      background: #1e8fff;
      box-shadow: 0 0 0 8px rgba(30, 143, 255, 0.18), 0 4px 14px rgba(0, 0, 0, 0.34);
    }

    .user-puck::before {
      position: absolute;
      top: 50%;
      left: 50%;
      display: none;
      width: 58px;
      height: 58px;
      border-radius: 50%;
      background: conic-gradient(from -21deg, rgba(30, 143, 255, 0.38) 0deg 42deg, transparent 42deg 360deg);
      transform: translate(-50%, -50%) rotate(var(--heading));
      content: "";
    }

    .user-puck.has-heading::before {
      display: block;
    }

    /* Stack the controls on small screens and leave room for MapLibre buttons. */
    @media (max-width: 720px) {
      header {
        align-items: stretch;
        flex-direction: column;
        gap: 10px;
      }

      h1 {
        font-size: 1rem;
      }

      .toolbar {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
      }

      select,
      button {
        min-height: 44px;
      }

      select {
        width: 100%;
        max-width: none;
      }

      .maplibregl-ctrl-top-right {
        top: 126px;
      }

      .maplibregl-ctrl button {
        width: 44px;
        height: 44px;
      }

      .project-marker {
        width: 32px;
        height: 32px;
      }

      .imagery-badge {
        bottom: 18px;
        max-width: calc(100vw - 82px);
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <!-- Top controls for project count, imagery mode, and 3D tilt. -->
    <header>
      <div class="brand">
        <h1>What's Being Built in St. Petersburg</h1>
        <div class="meta">
          <span id="projectCount">Loading projects</span>
          <span id="imageryNote">Auto newest aerial when available</span>
        </div>
      </div>
      <div class="toolbar">
        <select id="imagerySelect" aria-label="Imagery layer">
          <option value="auto">Auto newest aerial</option>
          <option value="global-satellite">Global satellite</option>
          <option value="street-map">Street map</option>
        </select>
        <button id="pitchToggle" type="button" class="active" aria-pressed="true" title="Toggle 3D view">3D</button>
      </div>
    </header>
    <!-- MapLibre renders the basemap, aerial layers, buildings, and markers here. -->
    <div id="map"></div>
    <div id="imageryBadge" class="imagery-badge" aria-live="polite">
      <strong id="imageryDate">Imagery date loading</strong>
      <span id="imagerySource">Checking the current map view</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    const isMobile = window.matchMedia('(pointer: coarse), (max-width: 720px)').matches;
    const mapCenter = [-82.6400, 27.7718];

    // Keep the rest of the app talking to a small map-provider boundary.
    // A future Google 3D Tiles, Cesium, Mapbox, or ArcGIS provider should match
    // the mapView contract instead of leaking provider calls everywhere.
    const mapProviderName = 'maplibre-public';
    const globalImageryLayerId = 'esri-world';
    const streetMapLayerId = 'osm-streets';
    const imageryMetadataUrl = 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/4/query';

    // Local aerial layers are only shown when the map is inside their coverage bounds.
    const localAerialImagery = [
      {
        id: 'pinellas-2025',
        optionLabel: 'Pinellas 2025 detail',
        note: 'Pinellas 2025 detail over global imagery',
        autoNote: 'Auto: Pinellas 2025 local aerials',
        dateLabel: '2025',
        sourceLabel: 'Pinellas County Enterprise GIS',
        resolutionLabel: '0.08 m',
        dateRank: 2025,
        priority: 100,
        minZoom: 10.5,
        bounds: {
          west: -82.94,
          south: 27.55,
          east: -82.50,
          north: 28.20
        }
      },
      {
        id: 'hillsborough-2025',
        optionLabel: 'Hillsborough 2025 detail',
        note: 'Hillsborough 2025 detail over global imagery',
        autoNote: 'Auto: Hillsborough 2025 local aerials',
        dateLabel: 'Jan 2025',
        sourceLabel: 'Hillsborough County Geospatial Services',
        resolutionLabel: '0.15 m',
        dateRank: 2025,
        priority: 90,
        minZoom: 10.5,
        bounds: {
          west: -82.78,
          south: 27.56,
          east: -82.05,
          north: 28.19
        }
      },
      {
        id: 'pinellas-2024',
        optionLabel: 'Pinellas 2024 detail',
        note: 'Pinellas 2024 detail over global imagery',
        autoNote: 'Auto: Pinellas 2024 local aerials',
        dateLabel: '2024',
        sourceLabel: 'Pinellas County Enterprise GIS',
        dateRank: 2024,
        priority: 80,
        minZoom: 10.5,
        bounds: {
          west: -82.94,
          south: 27.55,
          east: -82.50,
          north: 28.20
        }
      }
    ];
    const localAerialLayerIds = localAerialImagery.map((layer) => layer.id);
    const imageryNotes = {
      'auto': 'Auto newest aerial when available',
      'global-satellite': 'Global satellite imagery',
      'street-map': 'Global street map'
    };
    const imagerySelect = document.getElementById('imagerySelect');
    localAerialImagery.forEach((layer) => {
      imageryNotes[layer.id] = layer.note;
      const option = document.createElement('option');
      option.value = layer.id;
      option.textContent = layer.optionLabel;
      imagerySelect.appendChild(option);
    });
    let selectedImageryMode = 'auto';
    let activeImageryMode = 'global-satellite';
    let metadataAbortController = null;
    let metadataRequestId = 0;

    // Initialize the map with free/public raster imagery plus OpenFreeMap buildings.
    const map = new maplibregl.Map({
      container: 'map',
      center: mapCenter,
      zoom: isMobile ? 13.4 : 14.2,
      pitch: isMobile ? 48 : 55,
      bearing: isMobile ? -12 : -18,
      maxZoom: 20,
      maxPitch: 85,
      hash: true,
      attributionControl: false,
      style: {
        version: 8,
        sources: {
          'esri-world': {
            type: 'raster',
            tiles: [
              'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: 'Imagery &copy; Esri'
          },
          'osm-streets': {
            type: 'raster',
            tiles: [
              'https://a.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://b.tile.openstreetmap.org/{z}/{x}/{y}.png',
              'https://c.tile.openstreetmap.org/{z}/{x}/{y}.png'
            ],
            tileSize: 256,
            attribution: '&copy; OpenStreetMap contributors'
          },
          'pinellas-2025': {
            type: 'raster',
            tiles: [
              'https://egis.pinellas.gov/gis/rest/services/Aerials2025/ImageServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: 'Pinellas County Enterprise GIS'
          },
          'pinellas-2024': {
            type: 'raster',
            tiles: [
              'https://egis.pinellas.gov/gis/rest/services/Aerials/Aerials2024/ImageServer/exportImage?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256%2C256&format=jpgpng&transparent=false&f=image'
            ],
            tileSize: 256,
            attribution: 'Pinellas County Enterprise GIS'
          },
          'hillsborough-2025': {
            type: 'raster',
            tiles: [
              'https://maps.hillsboroughcounty.org/arcgis/rest/services/AerialsNew/Aerials_2025/ImageServer/tile/{z}/{y}/{x}'
            ],
            tileSize: 256,
            attribution: 'Hillsborough County Geospatial Services'
          },
          'openmaptiles': {
            type: 'vector',
            url: 'https://tiles.openfreemap.org/planet',
            attribution: '<a href="https://openfreemap.org" target="_blank" rel="noopener">OpenFreeMap</a> <a href="https://www.openmaptiles.org/" target="_blank" rel="noopener">&copy; OpenMapTiles</a> Data from <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>'
          },
          'terrain': {
            type: 'raster-dem',
            url: 'https://demotiles.maplibre.org/terrain-tiles/tiles.json',
            tileSize: 256,
            attribution: '<a href="https://earth.jaxa.jp/en/data/policy/" target="_blank" rel="noopener">AW3D30 (JAXA)</a>'
          }
        },
        layers: [
          {
            id: 'esri-world',
            type: 'raster',
            source: 'esri-world'
          },
          {
            id: 'osm-streets',
            type: 'raster',
            source: 'osm-streets',
            layout: {
              visibility: 'none'
            }
          },
          {
            id: 'pinellas-2025',
            type: 'raster',
            source: 'pinellas-2025',
            layout: {
              visibility: 'none'
            }
          },
          {
            id: 'pinellas-2024',
            type: 'raster',
            source: 'pinellas-2024',
            layout: {
              visibility: 'none'
            }
          },
          {
            id: 'hillsborough-2025',
            type: 'raster',
            source: 'hillsborough-2025',
            layout: {
              visibility: 'none'
            }
          },
          {
            id: 'terrain-shade',
            type: 'hillshade',
            source: 'terrain',
            paint: {
              'hillshade-shadow-color': '#1a2429',
              'hillshade-highlight-color': '#ffffff',
              'hillshade-accent-color': '#5b6d72',
              'hillshade-exaggeration': 0.25
            }
          },
          {
            id: 'building-3d',
            type: 'fill-extrusion',
            source: 'openmaptiles',
            'source-layer': 'building',
            minzoom: 14,
            filter: [
              'all',
              ['!=', ['get', 'hide_3d'], true]
            ],
            paint: {
              'fill-extrusion-color': [
                'case',
                ['has', 'colour'],
                ['get', 'colour'],
                '#d7d1c5'
              ],
              'fill-extrusion-height': [
                'interpolate',
                ['linear'],
                ['zoom'],
                14,
                0,
                14.8,
                ['coalesce', ['get', 'render_height'], 8]
              ],
              'fill-extrusion-base': ['coalesce', ['get', 'render_min_height'], 0],
              'fill-extrusion-opacity': 0.72,
              'fill-extrusion-vertical-gradient': true
            }
          }
        ],
        terrain: {
          source: 'terrain',
          exaggeration: isMobile ? 1.35 : 1.5
        },
        sky: {}
      }
    });

    map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
    map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

    function createMapLibreView(mapInstance) {
      let userLocationMarker = null;

      return {
        name: mapProviderName,
        getCenter() {
          return mapInstance.getCenter();
        },
        getZoom() {
          return mapInstance.getZoom();
        },
        onReady(callback) {
          mapInstance.once('style.load', callback);
          mapInstance.on('load', callback);
        },
        onViewChangeEnd(callback) {
          mapInstance.on('moveend', callback);
          mapInstance.on('zoomend', callback);
        },
        whenLayerReady(layerId, callback) {
          window.setTimeout(() => {
            if (mapInstance.getLayer(layerId)) callback();
          }, 1200);
        },
        setImageryVisibility(nextMode) {
          const showStreetMap = nextMode === 'street-map';
          mapInstance.setLayoutProperty(globalImageryLayerId, 'visibility', showStreetMap ? 'none' : 'visible');
          mapInstance.setLayoutProperty(streetMapLayerId, 'visibility', showStreetMap ? 'visible' : 'none');
          localAerialLayerIds.forEach((layerId) => {
            mapInstance.setLayoutProperty(layerId, 'visibility', nextMode === layerId ? 'visible' : 'none');
          });
        },
        set3DMode(enabled) {
          mapInstance.easeTo({
            pitch: enabled ? (isMobile ? 48 : 55) : 0,
            bearing: enabled ? (isMobile ? -12 : -18) : 0,
            duration: 650
          });
          mapInstance.setLayoutProperty('building-3d', 'visibility', enabled ? 'visible' : 'none');
          mapInstance.setLayoutProperty('terrain-shade', 'visibility', enabled ? 'visible' : 'none');
          mapInstance.setTerrain(enabled ? {
            source: 'terrain',
            exaggeration: isMobile ? 1.35 : 1.5
          } : null);
        },
        addProjectMarker(project, markerElement, popupMarkup) {
          new maplibregl.Marker({
            element: markerElement,
            anchor: 'bottom'
          })
            .setLngLat([project.lng, project.lat])
            .setPopup(new maplibregl.Popup({ offset: 24 }).setHTML(popupMarkup))
            .addTo(mapInstance);
        },
        setUserLocationMarker(markerElement, lngLat) {
          if (!userLocationMarker) {
            userLocationMarker = new maplibregl.Marker({
              element: markerElement,
              anchor: 'center'
            });
          }
          userLocationMarker.setLngLat(lngLat).addTo(mapInstance);
        },
        centerOnLocation(lngLat) {
          mapInstance.easeTo({
            center: lngLat,
            zoom: Math.max(mapInstance.getZoom(), 16),
            duration: 700
          });
        },
        addLocateControl(startTracking) {
          mapInstance.addControl(new LocateControl(startTracking), 'top-right');
        }
      };
    }

    class LocateControl {
      constructor(startTracking) {
        this.startTracking = startTracking;
      }

      onAdd() {
        const container = document.createElement('div');
        container.className = 'maplibregl-ctrl maplibregl-ctrl-group';

        const button = document.createElement('button');
        button.type = 'button';
        button.title = isMobile ? 'Show my location and heading' : 'Show my location';
        button.setAttribute('aria-label', button.title);
        button.innerHTML = '<span class="locate-icon" aria-hidden="true"></span>';
        button.addEventListener('click', () => this.startTracking(button));

        container.appendChild(button);
        return container;
      }

      onRemove() {}
    }

    function createMapProvider(providerName) {
      if (providerName === 'maplibre-public') {
        return createMapLibreView(map);
      }

      throw new Error(`Unsupported map provider: ${providerName}`);
    }

    const mapView = createMapProvider(mapProviderName);

    let locationWatchId = null;
    let userPuckElement = null;
    let hasCenteredOnUser = false;
    let hasStartedHeading = false;

    // Geolocation uses a custom marker so mobile users can see their heading.
    function ensureUserPuckElement() {
      if (userPuckElement) return userPuckElement;
      userPuckElement = document.createElement('div');
      userPuckElement.className = 'user-puck';
      userPuckElement.setAttribute('aria-label', 'Your location');
      return userPuckElement;
    }

    function setUserHeading(degrees) {
      if (!userPuckElement || degrees === null || Number.isNaN(degrees)) return;
      userPuckElement.classList.add('has-heading');
      userPuckElement.style.setProperty('--heading', `${degrees}deg`);
    }

    function updateUserLocation(position) {
      const lngLat = [position.coords.longitude, position.coords.latitude];
      mapView.setUserLocationMarker(ensureUserPuckElement(), lngLat);
      if (isMobile && typeof position.coords.heading === 'number') {
        setUserHeading(position.coords.heading);
      }
      if (!hasCenteredOnUser) {
        hasCenteredOnUser = true;
        mapView.centerOnLocation(lngLat);
      }
    }

    function headingFromDeviceEvent(event) {
      if (typeof event.webkitCompassHeading === 'number') {
        return event.webkitCompassHeading;
      }
      if (typeof event.alpha !== 'number') {
        return null;
      }
      return 360 - event.alpha;
    }

    async function startMobileHeading() {
      if (!isMobile || hasStartedHeading || !window.DeviceOrientationEvent) return;
      hasStartedHeading = true;
      try {
        if (typeof DeviceOrientationEvent.requestPermission === 'function') {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission !== 'granted') return;
        }
        const updateHeading = (event) => setUserHeading(headingFromDeviceEvent(event));
        window.addEventListener('deviceorientationabsolute', updateHeading, true);
        window.addEventListener('deviceorientation', updateHeading, true);
      } catch (error) {
        console.warn('Device orientation unavailable', error);
      }
    }

    function startLocationTracking(button) {
      if (!navigator.geolocation) {
        button.disabled = true;
        button.title = 'Location is unavailable';
        return;
      }
      button.classList.add('active');
      startMobileHeading();
      if (locationWatchId !== null) return;
      locationWatchId = navigator.geolocation.watchPosition(
        updateUserLocation,
        (error) => console.warn('Geolocation error', error),
        {
          enableHighAccuracy: true,
          maximumAge: 5000,
          timeout: 12000
        }
      );
    }

    mapView.addLocateControl(startLocationTracking);

    // Completed projects drop off the map after two years to keep the view current.
    function completionDateForCutoff(value) {
      if (!value) return null;
      const text = String(value);
      if (/^\d{4}$/.test(text)) {
        return new Date(Number(text), 11, 31);
      }
      if (/^\d{4}-\d{2}$/.test(text)) {
        const [year, month] = text.split('-').map(Number);
        return new Date(year, month, 0);
      }
      const parsed = new Date(text);
      return Number.isNaN(parsed.getTime()) ? null : parsed;
    }

    function shouldShowProject(project) {
      const twoYearsAgo = new Date();
      twoYearsAgo.setFullYear(twoYearsAgo.getFullYear() - 2);
      const completionDate = completionDateForCutoff(project.completed_at || project.built);
      if (!completionDate) return true;
      return completionDate >= twoYearsAgo;
    }

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, (char) => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function statusClass(status) {
      return `status-${String(status || 'unknown').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;
    }

    function popupHtml(project) {
      const details = [
        project.address ? `<span><strong>Address:</strong> ${escapeHtml(project.address)}</span>` : '',
        project.completed_at ? `<span><strong>Completed:</strong> ${escapeHtml(project.completed_at)}</span>` : '',
        project.expected_open ? `<span><strong>Expected:</strong> ${escapeHtml(project.expected_open)}</span>` : '',
        project.last_verified ? `<span><strong>Verified:</strong> ${escapeHtml(project.last_verified)}</span>` : ''
      ].filter(Boolean).join('');

      const sources = (project.sources || []).map((source) => (
        `<li><a href="${escapeHtml(source.url)}" target="_blank" rel="noopener noreferrer">${escapeHtml(source.label)}</a></li>`
      )).join('');

      return `
        <h2>${escapeHtml(project.name)}</h2>
        <span class="popup-status">${escapeHtml(project.status)}</span>
        ${details ? `<div class="popup-details">${details}</div>` : ''}
        ${project.summary ? `<p>${escapeHtml(project.summary)}</p>` : ''}
        ${sources ? `<p><strong>Sources</strong></p><ul>${sources}</ul>` : ''}
      `;
    }

    function plotProjects(projects) {
      const visibleProjects = projects.filter(shouldShowProject).filter((project) => project.lat && project.lng);
      document.getElementById('projectCount').textContent = `${visibleProjects.length} current projects`;

      // Each project gets a marker and a short popup sourced from projects.json.
      visibleProjects.forEach((project) => {
        const markerElement = document.createElement('button');
        markerElement.type = 'button';
        markerElement.className = `project-marker ${statusClass(project.status)}`;
        markerElement.title = project.name;
        markerElement.setAttribute('aria-label', project.name);

        mapView.addProjectMarker(project, markerElement, popupHtml(project));
      });
    }

    function localAerialById(id) {
      return localAerialImagery.find((layer) => layer.id === id);
    }

    function isLocalAerialVisible(layer) {
      const center = mapView.getCenter();
      return mapView.getZoom() >= layer.minZoom &&
        center.lng >= layer.bounds.west &&
        center.lng <= layer.bounds.east &&
        center.lat >= layer.bounds.south &&
        center.lat <= layer.bounds.north;
    }

    function bestLocalAerialForView() {
      return localAerialImagery
        .filter(isLocalAerialVisible)
        .sort((a, b) => b.dateRank - a.dateRank || b.priority - a.priority)[0] || null;
    }

    function visibleImageryMode() {
      if (selectedImageryMode === 'auto') {
        return bestLocalAerialForView()?.id || 'global-satellite';
      }
      return selectedImageryMode;
    }

    function setImageryBadge(dateText, sourceText) {
      document.getElementById('imageryDate').textContent = dateText;
      document.getElementById('imagerySource').textContent = sourceText;
    }

    function formatResolution(meters) {
      const value = Number(meters);
      if (!Number.isFinite(value) || value <= 0) return '';
      return value < 1 ? `${Math.round(value * 100)} cm` : `${value.toFixed(value < 10 ? 1 : 0)} m`;
    }

    function formatEsriDate(attributes) {
      if (attributes.SRC_DATE2) {
        const date = new Date(attributes.SRC_DATE2);
        if (!Number.isNaN(date.getTime())) {
          return date.toLocaleDateString(undefined, {
            month: 'short',
            year: 'numeric',
            timeZone: 'UTC'
          });
        }
      }

      const value = String(attributes.SRC_DATE || '');
      if (/^\d{8}$/.test(value)) {
        const date = new Date(Date.UTC(Number(value.slice(0, 4)), Number(value.slice(4, 6)) - 1, Number(value.slice(6, 8))));
        return date.toLocaleDateString(undefined, {
          month: 'short',
          year: 'numeric',
          timeZone: 'UTC'
        });
      }
      return 'Date unavailable';
    }

    function describeEsriMetadata(attributes) {
      const pieces = [
        attributes.SRC_DESC || attributes.NICE_NAME || 'Esri World Imagery',
        formatResolution(attributes.SRC_RES),
        attributes.ReleaseName
      ].filter(Boolean);
      return pieces.join(' - ');
    }

    // Ask Esri what source/date is visible for the current map center and zoom.
    async function updateGlobalImageryMetadata() {
      const requestId = ++metadataRequestId;
      if (metadataAbortController) {
        metadataAbortController.abort();
      }
      metadataAbortController = new AbortController();

      const center = mapView.getCenter();
      const zoomLevel = Math.max(0, Math.min(20, Math.round(mapView.getZoom())));
      const params = new URLSearchParams({
        f: 'json',
        geometry: `${center.lng},${center.lat}`,
        geometryType: 'esriGeometryPoint',
        inSR: '4326',
        spatialRel: 'esriSpatialRelIntersects',
        outFields: 'SRC_DATE,SRC_DATE2,SRC_RES,SRC_DESC,NICE_NAME,NICE_DESC,MinMapLevel,MaxMapLevel,DrawOrder,ReleaseName',
        returnGeometry: 'false',
        where: `MinMapLevel <= ${zoomLevel} AND MaxMapLevel >= ${zoomLevel}`,
        orderByFields: 'DrawOrder DESC'
      });

      try {
        const response = await fetch(`${imageryMetadataUrl}?${params}`, {
          signal: metadataAbortController.signal
        });
        if (!response.ok) throw new Error(`Metadata request failed: ${response.status}`);
        const data = await response.json();
        if (requestId !== metadataRequestId || activeImageryMode !== 'global-satellite') return;

        const attributes = data.features?.[0]?.attributes;
        if (!attributes) {
          setImageryBadge('Imagery date unavailable', 'Esri World Imagery metadata was not returned here');
          return;
        }

        setImageryBadge(`Imagery: ${formatEsriDate(attributes)}`, describeEsriMetadata(attributes));
      } catch (error) {
        if (error.name === 'AbortError') return;
        console.warn('Could not load imagery metadata', error);
        if (requestId === metadataRequestId && activeImageryMode === 'global-satellite') {
          setImageryBadge('Imagery date unavailable', 'Esri World Imagery metadata request failed');
        }
      }
    }

    function updateImageryBadge() {
      if (activeImageryMode === 'street-map') {
        setImageryBadge('Street map', 'Imagery date not applicable');
        return;
      }

      const localLayer = localAerialById(activeImageryMode);
      if (localLayer) {
        const details = [
          localLayer.sourceLabel,
          localLayer.resolutionLabel,
          localLayer.dateLabel.length === 4 ? 'collection month not published in this service' : ''
        ].filter(Boolean).join(' - ');
        setImageryBadge(`Imagery: ${localLayer.dateLabel}`, details);
        return;
      }

      setImageryBadge('Imagery date loading', 'Checking Esri World Imagery metadata');
      updateGlobalImageryMetadata();
    }

    function applyImageryMode() {
      const requestedLocalLayer = localAerialById(selectedImageryMode);
      const canShowRequestedLocalLayer = requestedLocalLayer && isLocalAerialVisible(requestedLocalLayer);
      const nextMode = canShowRequestedLocalLayer || !requestedLocalLayer ? visibleImageryMode() : 'global-satellite';

      mapView.setImageryVisibility(nextMode);

      activeImageryMode = nextMode;
      if (selectedImageryMode === 'auto') {
        document.getElementById('imageryNote').textContent = localAerialById(nextMode)?.autoNote || 'Auto: Esri latest global imagery';
      } else if (requestedLocalLayer && !canShowRequestedLocalLayer) {
        document.getElementById('imageryNote').textContent = 'Global satellite; zoom into the layer coverage area for local year detail';
      } else {
        document.getElementById('imageryNote').textContent = imageryNotes[selectedImageryMode];
      }

      updateImageryBadge();
    }

    // Re-check imagery after user changes or map movement because local layers have bounds.
    imagerySelect.addEventListener('change', (event) => {
      selectedImageryMode = event.target.value;
      applyImageryMode();
    });

    mapView.onReady(applyImageryMode);
    mapView.onViewChangeEnd(applyImageryMode);
    mapView.whenLayerReady(globalImageryLayerId, applyImageryMode);

    document.getElementById('pitchToggle').addEventListener('click', (event) => {
      const isActive = event.currentTarget.classList.toggle('active');
      event.currentTarget.setAttribute('aria-pressed', String(isActive));
      mapView.set3DMode(isActive);
    });

    // Project data stays in a simple local JSON file for now.
    fetch('projects.json')
      .then((response) => response.json())
      .then(plotProjects)
      .catch((error) => {
        console.warn('Could not load projects.json', error);
        document.getElementById('projectCount').textContent = 'Project data unavailable';
      });
  </script>
</body>
</html>
